<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Local Diary</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body class="mode-split">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="brand-section">
      <span class="brand-logo"></span>
      <span class="brand-title">Mini Local Diary</span>
      <span class="brand-version">v1.0</span>
    </div>

    <div class="view-controls">
      <button class="view-btn active" id="btnViewSplit" title="분할 뷰">Split</button>
      <button class="view-btn" id="btnViewEditor" title="에디터 전용">Editor</button>
      <button class="view-btn" id="btnViewPreview" title="미리보기 전용">Preview</button>
    </div>

    <div class="topbar-actions">
      <button class="btn-primary" id="btnNewDiary">
        <span>+ NEW ENTRY</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="app-container">
    
    <!-- LEFT SIDEBAR: DIARY LIST -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="category-filter" id="categoryFilterContainer">
          <button class="filter-chip active" data-category="ALL">ALL</button>
          <button class="filter-chip" data-category="family">FAMILY</button>
          <button class="filter-chip" data-category="secret">SECRET</button>
          <button class="filter-chip" data-category="personal">PERSONAL</button>
        </div>
        <div class="search-input-wrap">
          <input type="text" class="search-input" id="diarySearchInput" placeholder="검색 (제목, 본문)..." autocomplete="off">
        </div>
      </div>

      <ul class="diary-list" id="diaryList">
        <!-- 일기 목록 항목이 동적으로 삽입됩니다 -->
      </ul>
    </aside>

    <!-- RIGHT WORKSPACE: EDITOR & PREVIEW -->
    <section class="workspace">
      
      <!-- EDITOR PANEL -->
      <div class="editor-panel">
        <div class="meta-grid">
          <div class="meta-field">
            <label for="entryDate" class="meta-label">Date (YYYY-MM-DD)</label>
            <input type="date" id="entryDate" class="meta-input">
          </div>
          <div class="meta-field">
            <label for="entryTitle" class="meta-label">Title</label>
            <input type="text" id="entryTitle" class="meta-input" placeholder="일기 제목을 입력하세요">
          </div>
          <div class="meta-field">
            <label for="entryCategory" class="meta-label">Category</label>
            <select id="entryCategory" class="meta-select">
              <option value="personal">Personal</option>
              <option value="family">Family</option>
              <option value="secret">Secret</option>
              <option value="work">Work</option>
            </select>
          </div>
        </div>

        <div class="editor-body-wrap" id="editorDropZone">
          <textarea id="markdownEditor" class="markdown-textarea" placeholder="여기에 마크다운 일기를 작성하세요. 이미지를 드래그 앤 드롭하여 바로 첨부할 수 있습니다..."></textarea>
          <div class="drop-overlay" id="dropOverlay">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <div class="drop-overlay-text">이미지를 드롭하여 storage/assets 에 저장</div>
          </div>
        </div>

        <div class="editor-statusbar">
          <div class="status-left">
            <span class="status-indicator">
              <span class="status-dot" id="statusDot"></span>
              <span id="statusText">SAVED</span>
            </span>
            <span id="charCount">0자</span>
          </div>

          <div class="status-right">
            <input type="file" id="imageFileInput" accept="image/*" class="visually-hidden">
            <button class="btn-secondary" id="btnAttachImage" title="이미지 첨부">ATTACH IMAGE</button>
            <button class="btn-danger" id="btnDeleteDiary" title="일기 삭제">DELETE</button>
            <button class="btn-primary" id="btnSaveDiary" title="단축키 Ctrl+S / Cmd+S">SAVE (Ctrl+S)</button>
          </div>
        </div>
      </div>

      <!-- PREVIEW PANEL -->
      <div class="preview-panel">
        <div class="preview-header">
          <span class="preview-label">LIVE PREVIEW</span>
          <span id="previewCategoryBadge" class="diary-item-category">PERSONAL</span>
        </div>
        <div class="preview-content" id="previewContent">
          <!-- 렌더링된 HTML이 삽입됩니다 -->
        </div>
      </div>

    </section>

  </main>

  <!-- SCRIPTS -->
  <script src="js/neutralino.js"></script>
  <script src="js/marked.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
